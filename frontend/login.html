<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediRed · Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div class="entrada">
    <section class="sala">
      <div>
        <h1>MediRed</h1>
        <p>Pacientes, médicos, citas e historias clínicas de la red, en un solo lugar.</p>
      </div>
      <ul class="servicios-deco" aria-hidden="true">
        <li><strong>Pacientes</strong><span>ms-pacientes · 3002</span></li>
        <li><strong>Médicos</strong><span>ms-medicos · 3003</span></li>
        <li><strong>Citas</strong><span>ms-citas · 3004</span></li>
        <li><strong>Historias clínicas</strong><span>ms-historias · 3005</span></li>
      </ul>
    </section>

    <section class="acceso">
      <form id="form-login" novalidate>
        <h2>Iniciar sesión</h2>
        <p class="indicacion">Use el email y la contraseña de su cuenta.</p>
        <label class="campo"><span>Email</span>
          <input name="email" type="email" autocomplete="username" required>
        </label>
        <label class="campo"><span>Contraseña</span>
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="boton" type="submit">Entrar</button>
        <p class="error-acceso" id="error-login" role="alert"></p>

      </form>
    </section>
  </div>

  <script src="js/config.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/api.js"></script>
  <script>
    const form = document.getElementById('form-login');
    const error = document.getElementById('error-login');

    // Si ya hay sesión, ir directo a la página del rol
    const yaEntro = usuarioActual();
    if (yaEntro) location.href = PAGINA_POR_ROL[yaEntro.rol];


    form.onsubmit = async (evento) => {
      evento.preventDefault();
      error.textContent = '';
      const email = form.elements.email.value.trim();
      const password = form.elements.password.value;
      if (!email || !password) {
        error.textContent = 'Escriba el email y la contraseña.';
        return;
      }
      try {
        await iniciarSesion(email, password);
      } catch (e) {
        error.textContent = e.status === 401 ? 'Email o contraseña incorrectos.' : e.message;
      }
    };
  </script>
</body>
</html>
